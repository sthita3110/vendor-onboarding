# Render Blueprint: one Docker web service built from the repo-root Dockerfile.
services:
  - type: web
    name: vendor-onboarding
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false   # set in the Render dashboard; never committed
      - key: APP_PASSCODE
        sync: false   # required in production: gates endpoints that spend OpenAI credit
      - key: OPENAI_MODEL
        value: gpt-4.1   # chosen by scripts/benchmark_extraction.py (see ARCHITECTURE.md §6)
